# Build-check only — does NOT publish to the builds branch.
#
# Why: the `builds` branch serves the ORIGINAL XDMovies.cs3 (v12 by phisher98,
# with the Cloudflare WebView bypass). The previous workflow overwrote it with
# the local clean-room rebuild on every push. Keep this workflow check-only
# unless you deliberately want to publish the rebuild again.

name: Build check

on:
  workflow_dispatch:
  push:
    branches: [master, main]
    paths-ignore:
      - '**.md'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            **/*.gradle*
            gradle/wrapper/gradle-wrapper.properties

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Compile extension (no publish)
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon make
          find . -path '*/build/*.cs3' -type f -print -quit | grep -q .
          echo 'Build OK — builds branch left untouched.'
